name: Deploy do crawler

# Sem chave de acesso AWS no GitHub: o job assume uma role via OIDC
# (infra/bootstrap/github-oidc.yaml).
on:
  push:
    branches: [main]
    paths:
      - "apps/crawler/**"
      - "packages/sischef/**"
      - "packages/shared/**"
      - "infra/crawler/**"
      - ".github/workflows/deploy-crawler.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-crawler
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar a Lambda do crawler
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

      - name: Conferir a configuracao antes de tentar publicar
        run: |
          # O sam deploy recusa parametro vazio com "X= is not a valid format", que nao
          # diz QUAL faltou. Este passo falha antes, nomeando o que precisa ser criado.
          falta=0
          checar() {
            if [ -z "$2" ]; then echo "::error::falta $1 ($3)"; falta=1; fi
          }
          checar SISCHEF_USUARIO         "${{ secrets.SISCHEF_USUARIO }}"         "secret: usuario do sistema.sischef.com"
          checar SISCHEF_SENHA           "${{ secrets.SISCHEF_SENHA }}"           "secret: senha dele"
          checar CRAWLER_API_KEYS_SHA256 "${{ secrets.CRAWLER_API_KEYS_SHA256 }}" "secret: hash da chave desta rotina"
          checar REPORTS_BUCKET          "${{ vars.REPORTS_BUCKET }}"             "variable: bucket de dados"
          [ "$falta" -eq 0 ] || { echo "Configure em Settings > Secrets and variables > Actions."; exit 1; }

      - name: Bundle da Lambda
        run: npm run build -w @automacoes/crawler
        env:
          APP_VERSION: ${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam build e deploy
        working-directory: infra/crawler
        run: |
          # O AppVersion vai no build tambem: e' dele que sai a tag da imagem no
          # ECR (sem isso a tag fica "-dev" e nao diz de qual commit veio).
          sam build --parameter-overrides AppVersion="${{ github.sha }}"
          sam deploy \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              SischefUsuario="${{ secrets.SISCHEF_USUARIO }}" \
              SischefSenha="${{ secrets.SISCHEF_SENHA }}" \
              ApiKeysSha256="${{ secrets.CRAWLER_API_KEYS_SHA256 }}" \
              ReportsBucket="${{ vars.REPORTS_BUCKET }}" \
              AppVersion="${{ github.sha }}"

      - name: Smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name automacoes-hungara-crawler --region sa-east-1 \
                --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" --output text)
          echo "Endpoint: $URL"
          curl --fail --silent --show-error "${URL}health"
