name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    name: Typecheck, testes e build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      # Se a tag da imagem e a lib divergirem, o browser da Lambda deixa de ser
      # o mesmo que gravou o fluxo — e a falha aparece só em producao.
      - name: Versao do Playwright bate com a tag da imagem
        run: |
          LIB=$(node -p "require('./apps/crawler/runtime-package.json').dependencies.playwright")
          IMG=$(sed -n 's|^FROM mcr.microsoft.com/playwright:v\([0-9.]*\)-.*|\1|p' apps/crawler/Dockerfile | head -1)
          echo "runtime-package.json=$LIB  Dockerfile=$IMG"
          [ "$LIB" = "$IMG" ] || { echo "Divergiram. Acerte os dois."; exit 1; }
          PKG=$(node -p "require('./packages/sischef/package.json').dependencies.playwright")
          [ "$PKG" = "$LIB" ] || { echo "packages/sischef pede $PKG, runtime usa $LIB"; exit 1; }

      - name: Bundle e validacao do SAM
        run: |
          npm run build -w @automacoes/crawler
          npm run build -w @automacoes/logistica-lambda
          pipx install aws-sam-cli || pip install --quiet aws-sam-cli
          # Uma stack por rotina: todas tem que validar. Um `for` para nao dar para
          # mover um template de pasta e esquecer de acertar o caminho aqui (foi o
          # que aconteceu na renomeacao do repositorio).
          for t in infra/*/template.yaml; do
            echo "→ $t"
            sam validate --lint --region sa-east-1 --template "$t"
          done

      - name: Build da imagem (sem push)
        run: docker build -f apps/crawler/Dockerfile -t automacoes-hungara-crawler:ci .
